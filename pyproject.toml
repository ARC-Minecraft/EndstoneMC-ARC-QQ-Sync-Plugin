[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-arc-qq-sync-astrbot"
version = "1.0.1"
description = "ARC QQ Sync (AstrBot Version) - Endstone 子服插件，连接弧光消息中心实现群服互通"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DEVILENMO", email = "DEVILENMO@gmail.com" },
]
license = "MIT"
[project.urls]
Homepage = "https://github.com/ARC-Minecraft/EndstoneMC-ARC-QQ-Sync-Plugin"

[project.entry-points."endstone"]
arc-qq-sync-astrbot = "endstone_arc_qq_sync_astrbot.plugin:ArcQQSyncAstrbot"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_arc_qq_sync_astrbot"]
